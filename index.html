<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>products</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="catalog">
      <div class="catalog__container container">
        <h1 class="catalog__title">Выбери свой продукт</h1>
        <button id="change-color-card-button">сменить цвет</button>
        <button id="change-color-all-card-button">сменить цвет</button>
        <button id="open-google-button">перейти в google</button>
        <button id="output-log-button">вывести сообщение в консоль</button>
        <button class="btn">нажми на меня</button>

        <template id="card-template">
          <li class="products__item card">
            <img src="" alt="" class="card__image" />
            <span class="card__category"></span>
            <h2 class="card__name"></h2>
            <p class="card__description"></p>

            <div class="card__compound compound">
              <span class="compound__name">Состав:</span>
              <ul class="compound__list"></ul>
            </div>

            <div class="card__price price">
              <b class="price__title">Цена</b>
              <span class="price__value"></span>
            </div>
          </li>
        </template>

        <ul id="product-list" class="products"></ul>
      </div>
    </main>
    <script src="main.js"></script>
    <script src="homework-7.js"></script>
    <script src="homework-8.js"></script>
    <script src="homework-9.js" type="module"></script>
    <script src="homework-10.js" type="module"></script>
  </body>
</html>
